name: CI with Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag static-site .

      - name: Start container
        run: docker run --detach --name static-site --publish 8080:80 static-site

      - name: Verify site
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "The Docker container did not serve the site."
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force static-site
